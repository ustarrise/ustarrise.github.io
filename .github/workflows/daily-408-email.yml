name: 408 Daily Email Reminder

on:
  schedule:
    # UTC 21:50/22:00/22:10 = Beijing next day 05:50/06:00/06:10
    # Multiple triggers improve resilience; duplicate sends are guarded below.
    - cron: '50 21 * * *'
    - cron: '0 22 * * *'
    - cron: '10 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-408-email
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true

      - name: Wait for Beijing 06:00 and today's lesson, then send once
        env:
          SMTP_HOST: ${{ secrets.DAILY408_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.DAILY408_SMTP_PORT }}
          SMTP_USER: ${{ secrets.DAILY408_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.DAILY408_SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.DAILY408_MAIL_TO }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          today="$(TZ=Asia/Shanghai date +%F)"
          marker="408-algorithm/.email-sent/${today}.txt"
          # A scheduled run can start hours late; do not reject it by wall-clock cutoff.
          for attempt in $(seq 1 10); do
            beijing_clock="$(TZ=Asia/Shanghai date +%H%M)"
            if [ "$beijing_clock" -lt 0600 ]; then
              echo "尚未到北京时间06:00，等待5分钟"
              sleep 300
              continue
            fi
            git fetch origin master
            if git cat-file -e "origin/master:${marker}" 2>/dev/null; then
              echo "今天已经发送过邮件，避免重复发送"
              exit 0
            fi
            git show origin/master:408-algorithm/lessons.json > /tmp/daily408-lessons.json
            if ! python3 -c 'import json,sys; from datetime import datetime; from zoneinfo import ZoneInfo; d=datetime.now(ZoneInfo("Asia/Shanghai")).date().isoformat(); a=json.load(open(sys.argv[1])); sys.exit(0 if sum(x.get("date")==d for x in a)==1 else 1)' /tmp/daily408-lessons.json; then
              echo "今日课程尚未发布，5分钟后重查 (${attempt}/13)"
              sleep 300
              continue
            fi
            # SMTP submission happens only after today's lesson exists.
            # If SMTP fails, retry in 5 minutes; never mark the day as sent.
            if ! python3 408-algorithm/send_daily_email.py /tmp/daily408-lessons.json; then
              echo "邮件发送失败，5分钟后重试 (${attempt}/13)"
              sleep 300
              continue
            fi
            # Persist the sent marker on master. Concurrency serializes workflow runs.
            git reset --hard origin/master
            mkdir -p 408-algorithm/.email-sent
            printf 'Sent on %s (Asia/Shanghai)\n' "$(TZ=Asia/Shanghai date '+%F %T')" > "$marker"
            git add "$marker"
            git commit -m "Record 408 reminder sent for ${today}"
            if ! git push origin HEAD:master; then
              echo "::error::邮件已提交给SMTP，但去重标记推送失败；请检查后续是否重复发送"
              exit 1
            fi
            echo "今日邮件已发送且写入去重标记"
            exit 0
          done
          echo "::error::本次运行重试次数耗尽，今日未能确认发送"
          exit 1
